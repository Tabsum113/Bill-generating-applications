<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome | Clothing Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            background-image: url('/static/images/welcome_bg.jpg'); /* Replace with your image path */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
        }

        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .welcome-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .welcome-box h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .welcome-box p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .btn-glow {
            padding: 12px 30px;
            font-size: 1.1rem;
            border: none;
            background-color: #ffc107;
            color: black;
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
        }

        .btn-glow:hover {
            background-color: #ffca2c;
            box-shadow: 0 0 10px #ffc107, 0 0 20px #ffc107;
            color: black;
        }

        footer {
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            text-align: center;
            padding: 15px 0;
        }

        .social-icons a {
            color: white;
            margin: 0 10px;
            font-size: 1.2rem;
        }

        .social-icons a:hover {
            color: #ffc107;
        }
    </style>
</head>
<body>

    <div class="content">
        <div class="welcome-box">
            <h1>Welcome to the Clothing Store</h1>
            <p>Style meets simplicity. Shop the trend!</p>
            <a href="/catalog">
                <img src="/static/images/shopping.jpg" alt="Enter Store" style="width: 200px; border-radius: 10px; margin-bottom: 20px;">
            </a><br>
            <a href="/catalog" class="btn btn-glow">Enter Store</a>
        </div>
    </div>

    <footer>
        <div>
            <strong>Contact Us:</strong> support@clothingstore.com | +91-9876543210
        </div>
        <div class="social-icons mt-2">
            <a href="#"><i class="bi bi-facebook"></i></a>
            <a href="#"><i class="bi bi-instagram"></i></a>
            <a href="#"><i class="bi bi-twitter"></i></a>
            <a href="#"><i class="bi bi-envelope"></i></a>
        </div>
        <div class="mt-2">
            &copy; 2025 Clothing Store. All rights reserved.
        </div>
    </footer>

</body>
</html>
