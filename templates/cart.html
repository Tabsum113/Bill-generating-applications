<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <!-- Navbar with Cart Icon -->
<nav class="navbar navbar-dark bg-dark px-4">
  <a class="navbar-brand" href="/">🛍️ Clothing Store</a>
  <div>
    <a href="/cart" class="btn btn-warning position-relative">
      <i class="bi bi-cart-fill"></i> Cart
      <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
        {{ session['cart']|length if session.get('cart') else 0 }}
      </span>
    </a>
  </div>
</nav>
<div class="container mt-5">
    <h3>Your Cart</h3>
    <ul class="list-group">
        {% for item in cart %}
        <li class="list-group-item d-flex justify-content-between">
            {{ item.name }} - ₹{{ item.price }}
        </li>
        {% endfor %}
        <li class="list-group-item d-flex justify-content-between">
            <strong>Total</strong>
            <strong>₹{{ total }}</strong>
        </li>
    </ul>
    <form action="/checkout" method="post" class="mt-4">
        <div class="mb-3">
            <label for="customer_name" class="form-label">Customer Name</label>
            <input type="text" class="form-control" name="customer_name" required>
        </div>
        <button class="btn btn-success">Generate Bill</button>
    </form>
</div>
</body>
</html>
