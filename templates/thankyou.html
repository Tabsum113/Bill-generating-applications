<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thank You</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to right, #f8f9fa, #e9ecef);
        }
        .content {
            flex: 1;
        }
        footer {
            background-color: #343a40;
            color: white;
            padding: 15px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container mt-5 text-center content">
        <h1>Thank You, {{ customer }}!</h1>
        <p>You have purchased: <strong>{{ items }}</strong></p>
        <p>Total Amount: <strong>₹{{ total }}</strong></p>
        <a href="/" class="btn btn-primary mt-3">Back to Catalog</a>
    </div>

    <footer>
        <p>&copy; 2025 Clothing Store. All rights reserved.</p>
        <p>Follow us on 
            <a href="#" style="color: #f8f9fa;">Instagram</a> |
            <a href="#" style="color: #f8f9fa;">Facebook</a> |
            <a href="#" style="color: #f8f9fa;">Twitter</a>
        </p>
    </footer>
</body>
</html>
